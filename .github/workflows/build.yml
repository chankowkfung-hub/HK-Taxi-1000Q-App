name: Build AAB V16 BlackGold AdFull

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || true

      

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build AAB V16
        run: |
          ./gradlew clean
          gradle --version
          gradle bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-V16-BlackGold
          path: app/build/outputs/bundle/release/app-release.aab
